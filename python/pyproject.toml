[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuzip"
dynamic = ["version"]
description = "Extract ZIP archives on an NVIDIA GPU with nvCOMP, with CPU fallback; RAR, 7z and tar via 7-Zip"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dependencies = []

[project.optional-dependencies]
gpu = ["nvidia-nvcomp-cu13>=6.0", "cupy-cuda13x>=14.0", "numpy>=2.0"]

[project.scripts]
gpuzip = "gpuzip:main"

[tool.setuptools]
py-modules = ["gpuzip"]

[tool.setuptools.dynamic]
version = { attr = "gpuzip.__version__" }
