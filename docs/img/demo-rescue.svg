<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 926 462" width="926" height="462" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" role="img" aria-label="A tar.gz with three bad disk sectors"><rect width="926" height="462" rx="10" fill="#161b22"/><circle cx="24" cy="18" r="6" fill="#ff5f57"/><circle cx="44" cy="18" r="6" fill="#febc2e"/><circle cx="64" cy="18" r="6" fill="#28c840"/><text x="463.0" y="23" fill="#7d8590" font-size="13" text-anchor="middle">A tar.gz with three bad disk sectors</text><text y="58" xml:space="preserve"><tspan x="18.0" fill="#7ee787" font-weight="700">$ </tspan><tspan x="34.8" fill="#e6edf3" font-weight="700">gzip -t python-stdlib.tar.gz</tspan></text><text y="78" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">gzip: python-stdlib.tar.gz: invalid compressed data--format violated</tspan></text><text y="98" xml:space="preserve"><tspan x="18.0" fill="#7ee787" font-weight="700">$ </tspan><tspan x="34.8" fill="#e6edf3" font-weight="700">gpuzip rescue python-stdlib.tar.gz</tspan></text><text y="118" xml:space="preserve"><tspan x="18.0" fill="#e6edf3" font-weight="700">Rescued</tspan><tspan x="76.8" fill="#e6edf3"> python-stdlib.tar.gz in 1.95 s into ./python-stdlib</tspan></text><rect x="34.8" y="126" width="327.6" height="14" fill="#3fb950"/><rect x="362.4" y="126" width="8.4" height="14" fill="#39c5cf"/><text y="138" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="370.8" fill="#e6edf3">  </tspan><tspan x="387.6" fill="#e6edf3" font-weight="700">96.4%</tspan><tspan x="429.6" fill="#e6edf3"> of the data exact</tspan></text><text y="158" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#3fb950" font-weight="700">1,690</tspan><tspan x="76.8" fill="#e6edf3"> files intact</tspan></text><text y="178" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#d29922" font-weight="700">   32</tspan><tspan x="76.8" fill="#e6edf3"> possibly damaged    </tspan><tspan x="253.2" fill="#7d8590">inside a damaged block or after a repaired header</tspan></text><text y="198" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#ff7b72" font-weight="700">  102</tspan><tspan x="76.8" fill="#e6edf3"> partial             </tspan><tspan x="253.2" fill="#7d8590">unknown bytes written as 0x00</tspan></text><text y="218" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#ff7b72" font-weight="700">    4</tspan><tspan x="76.8" fill="#e6edf3"> regions unreadable  </tspan><tspan x="253.2" fill="#7d8590">307.7 KB skipped, the files there lost</tspan></text><text y="238" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">    </tspan><tspan x="51.6" fill="#ff7b72" font-weight="700">partial:</tspan><tspan x="118.8" fill="#e6edf3"> os.py</tspan></text><text y="258" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">    </tspan><tspan x="51.6" fill="#ff7b72" font-weight="700">partial:</tspan><tspan x="118.8" fill="#e6edf3"> pickle.py</tspan></text><text y="278" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">    </tspan><tspan x="51.6" fill="#ff7b72" font-weight="700">partial:</tspan><tspan x="118.8" fill="#e6edf3"> plistlib.py</tspan></text><text y="298" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">    </tspan><tspan x="51.6" fill="#7d8590">... and 99 more partial (-v lists them)</tspan></text><text y="318" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">    </tspan><tspan x="51.6" fill="#d29922" font-weight="700">possibly damaged:</tspan><tspan x="194.4" fill="#e6edf3"> optparse.py</tspan></text><text y="338" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">    </tspan><tspan x="51.6" fill="#d29922" font-weight="700">possibly damaged:</tspan><tspan x="194.4" fill="#e6edf3"> site-packages/pip/_vendor/__init__.py</tspan></text><text y="358" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">    </tspan><tspan x="51.6" fill="#d29922" font-weight="700">possibly damaged:</tspan><tspan x="194.4" fill="#e6edf3"> site-packages/pip/_vendor/vendor.txt</tspan></text><text y="378" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">    </tspan><tspan x="51.6" fill="#7d8590">... and 29 more possibly damaged (-v lists them)</tspan></text><text y="398" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#7d8590">Note: 1 tar header had unknown bytes and was made whole from the one before it (its checksum confirms)</tspan></text><text y="418" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#7d8590">With damaged blocks the checksum cannot be checked: &quot;intact&quot; means every byte decoded cleanly</tspan></text><text y="438" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#7d8590">-v adds every file, damaged block and note (3); --json gives the whole report</tspan></text></svg>
