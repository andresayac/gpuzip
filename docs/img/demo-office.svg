<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 926 242" width="926" height="242" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" role="img" aria-label="A Word document sent through FTP in ASCII mode"><rect width="926" height="242" rx="10" fill="#161b22"/><circle cx="24" cy="18" r="6" fill="#ff5f57"/><circle cx="44" cy="18" r="6" fill="#febc2e"/><circle cx="64" cy="18" r="6" fill="#28c840"/><text x="463.0" y="23" fill="#7d8590" font-size="13" text-anchor="middle">A Word document sent through FTP in ASCII mode</text><text y="58" xml:space="preserve"><tspan x="18.0" fill="#7ee787" font-weight="700">$ </tspan><tspan x="34.8" fill="#e6edf3" font-weight="700">gpuzip rescue report.docx</tspan></text><text y="78" xml:space="preserve"><tspan x="18.0" fill="#e6edf3" font-weight="700">Rescued</tspan><tspan x="76.8" fill="#e6edf3"> report.docx in 4.33 s into ./report_out</tspan></text><rect x="34.8" y="86" width="336.0" height="14" fill="#3fb950"/><text y="98" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="370.8" fill="#e6edf3">  </tspan><tspan x="387.6" fill="#3fb950" font-weight="700">every entry recovered, each CRC checks</tspan></text><text y="118" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#3fb950" font-weight="700">10</tspan><tspan x="51.6" fill="#e6edf3"> intact</tspan></text><text y="138" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#7d8590">directory read</tspan></text><text y="158" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#3fb950" font-weight="700">Rebuilt document:</tspan><tspan x="177.6" fill="#e6edf3"> ./report_out/recovered.docx</tspan></text><text y="178" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#39c5cf" font-weight="700">Text recovered:</tspan><tspan x="160.8" fill="#e6edf3"> ./report_out/recovered-text.txt (352,905 characters)</tspan></text><text y="198" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#39c5cf" font-weight="700">3 CRs lost to an ASCII-mode transfer put back, each entry&#x27;s CRC confirming them</tspan></text><text y="218" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="34.8" fill="#7d8590">-v adds every entry and note (2); --json gives the whole report</tspan></text></svg>
