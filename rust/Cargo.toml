[package]
name = "gpuzip"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Recover what damaged .gz, .tar.gz, .zip and Office files still hold, and extract archives fast on the CPU or an NVIDIA GPU"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andresayac/gpuzip"
readme = "../README.md"
keywords = ["zip", "gzip", "recovery", "gpu", "cuda"]
categories = ["command-line-utilities", "compression"]

[dependencies]
anstream = "1"
anstyle = "1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
crossbeam-channel = "0.5.17"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
glob = "0.3.4"
libdeflater = "1.26.1"
libloading = "0.9.0"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
