name: Bug report
description: gpuzip failed, crashed, or gave back the wrong bytes
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what it printed, and what you expected instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: gpuzip doctor
      description: The output of `gpuzip doctor` (the GPU, nvCOMP, gpuinflate, rescue and 7-Zip it found).
      render: text
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: The JSON report
      description: For a rescue or a failed extraction, the same command with `--json` added.
      render: json
  - type: textarea
    id: archive
    attributes:
      label: The archive
      description: How it was made or damaged, its size, and, if you can share it, a link to it or a script that makes it.
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11 / Ubuntu 24.04 / macOS 15, RTX 4070, gpuzip 0.1.0
    validations:
      required: true
