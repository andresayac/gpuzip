[package]
name = "gpuzip"
version = "0.2.1"
edition = "2024"
rust-version = "1.87"
description = "Recover what damaged .gz, .tar.gz, .zip and Office files still hold, and extract archives fast on the CPU or an NVIDIA GPU"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andresayac/gpuzip"
readme = "README.md"
# a package of the program alone: the libraries, tests, benchmarks and studies are built and run apart
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
keywords = ["zip", "gzip", "recovery", "gpu", "cuda"]
categories = ["command-line-utilities", "compression"]

[dependencies]
anstream = "1"
anstyle = "1"
bzip2 = "0.6.1" # rescue of bzip2 ZIP entries (its default backend is libbz2-rs-sys: Rust, no C)
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
crossbeam-channel = "0.5.17"
deflate64 = "0.1.12" # rescue of Deflate64 ZIP entries
encoding_rs = "0.8.35" # --codepage: ZIP names from Windows in another language
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
glob = "0.3.4"
libdeflater = "1.26.1"
libdeflate-sys = "1.26.1" # libdeflater's own: its _ex call says how many input bytes a stream took
libloading = "0.9.0"
lzma-rs = "0.3.0" # rescue of LZMA ZIP entries
memmap2 = "0.9.11"
ruzstd = "0.9.1" # rescue of Zstandard ZIP entries (a decoder in Rust)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0" # doctor --get-nvcomp: the download checked against the SHA-256 PyPI gives
tar = "0.4"
# doctor --get-nvcomp: nvCOMP from PyPI over HTTPS, TLS in Rust (no OpenSSL to find at run time)
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
